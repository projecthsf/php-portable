name: Publish to JetBrains Marketplace

# Publishing is a deliberate act, decoupled from merging: pushing a `v*` tag (or running this
# workflow manually) publishes. Merging to main ships nothing, so pull requests — including
# ones from outside contributors — can be reviewed and merged without releasing to every user.
# Mechanical checks on merge live in ci.yml.
#
# To cut a release:
#   1. bump `version = "x.y.z"` in build.gradle.kts (+ update <change-notes> in plugin.xml)
#   2. merge to main
#   3. git tag vx.y.z && git push origin vx.y.z
#
# The Marketplace rejects duplicate versions, so a version can only be published once —
# re-tagging an already-published version fails loudly at the upload step.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'   # Kotlin 1.9 compiler is unstable on newer JDKs; pin 17
          cache: gradle

      - name: Read plugin version
        id: ver
        run: |
          VERSION=$(grep -E '^version = ' build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then echo "Could not parse version"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      # A tag that disagrees with build.gradle.kts would publish something other than what the
      # tag names. Refuse rather than guess. (Skipped on manual runs, which publish whatever
      # version is on the chosen ref.)
      - name: Check the tag matches build.gradle.kts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Tag v$TAG does not match version ${{ steps.ver.outputs.version }} in build.gradle.kts"
            exit 1
          fi

      # Gate: run the JetBrains Plugin Verifier before publishing. Fails the job (and blocks
      # the publish step below) on internal-API / compatibility / structural problems — the
      # class of issue that shipped in 0.1.2. Downloads the latest IDEA (~1.5 GB).
      # failureLevel is configured in build.gradle.kts.
      - name: Verify plugin (pre-publish gate)
        run: ./gradlew verifyPlugin --no-daemon --stacktrace

      - name: Publish plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon --stacktrace
